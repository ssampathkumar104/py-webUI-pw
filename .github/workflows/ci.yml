# ita_pw CI pipeline skeleton (spec task 1.7, GitHub Actions variant).
#
# Job chain (fail-fast): lint -> unit -> equivalence -> integration -> package
# Each job `needs` the previous one, so a red job stops everything after it.
#
# Secrets: NEVER written in this file. Future secrets (Nexus/PyPI index credentials)
# go in GitHub repo Settings -> Secrets and variables -> Actions and are referenced
# as ${{ secrets.NAME }} only inside the publish step (task 16.1).
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.5"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests

  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Unit tests
        run: uv run pytest tests/unit -v

  equivalence:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Equivalence gate
        run: uv run pytest tests/equivalence -v

  integration:
    needs: equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # STUB until task 16.1: pre-provision Playwright browsers here so no test
      # triggers a first-run download (M1.2 gotcha), e.g.
      #   uv run playwright install --with-deps chromium
      - name: Integration stage placeholder
        run: echo "integration stage is a stub until Playwright is added (task 16.1)"

  package:
    needs: integration
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Build package
        run: uv build
      # STUB until task 16.1: publish to the private index using repo Secrets.
      - name: Publish placeholder
        run: echo "publish is a stub until task 16.1 (credentials come from repo Secrets)"
