[project]
name = "ita-pw"
version = "0.1.0"
description = "Web UI Test Automation - Playwright + Python + Pytest framework (migrated from pw-Java)."
readme = "README.md"
authors = [
    { name = "Sampath Sankati", email = "Sampath.Sankati@infor.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pytest==8.3.4",
    "pytest-xdist==3.6.1",
    "pytest-rerunfailures==15.0",
]

[project.entry-points.pytest11]
ita_pw = "ita_pw.plugin"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
